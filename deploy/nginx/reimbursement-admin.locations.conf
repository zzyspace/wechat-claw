location = /expense {
  include /etc/nginx/snippets/admin-auth-reimbursement.inc;
  error_page 401 = @admin_login_redirect;

  proxy_pass http://127.0.0.1:8788/expense;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /expense/ {
  include /etc/nginx/snippets/admin-auth-reimbursement.inc;
  error_page 401 = @admin_login_redirect;

  proxy_pass http://127.0.0.1:8788/expense/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /expense/submit {
  include /etc/nginx/snippets/admin-auth-reimbursement.inc;
  error_page 401 = @admin_login_redirect;

  proxy_pass http://127.0.0.1:8788/expense/submit;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health/expense {
  proxy_pass http://127.0.0.1:8788/health/expense;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /expense/api/shortcut/reports {
  client_max_body_size 21m;
  proxy_read_timeout 120s;
  proxy_pass http://127.0.0.1:8788;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /expense/api/ {
  include /etc/nginx/snippets/admin-auth-reimbursement.inc;
  error_page 401 = /auth/api/unauthorized;

  proxy_pass http://127.0.0.1:8788;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
