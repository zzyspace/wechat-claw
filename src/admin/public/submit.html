<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>新建报账</title>
    <!-- Shared admin top bar and theme, served by admin-auth-gateway. admin-shell.js must precede user-menu.js. -->
    <link rel="stylesheet" href="/auth/accounts/admin-shell.css" />
    <script src="/auth/accounts/admin-theme.js"></script>
    <style>
      /* Allow touch scrolling without page pinch zoom. */
      html { touch-action: pan-x pan-y; }
      :root {
        --bg: #f2f2f7;
        --surface: rgba(255, 255, 255, 0.86);
        --surface-muted: rgba(255, 255, 255, 0.72);
        --surface-input: rgba(255, 255, 255, 0.94);
        --line: rgba(60, 60, 67, 0.16);
        --line-strong: rgba(60, 60, 67, 0.25);
        --ink: #1c1c1e;
        --ink-soft: #6e6e73;
        --brand: #007aff;
        --brand-soft: rgba(0, 122, 255, 0.12);
        --danger: #ff3b30;
        --success: #16843f;
        --shadow: 0 24px 60px rgba(28, 28, 30, 0.1);
      }

      :root[data-theme="dark"] {
        --bg: #0d1117;
        --surface: rgba(27, 34, 45, 0.9);
        --surface-muted: rgba(41, 51, 66, 0.82);
        --surface-input: rgba(17, 23, 32, 0.92);
        --line: rgba(235, 242, 255, 0.14);
        --line-strong: rgba(235, 242, 255, 0.28);
        --ink: #f2f5f9;
        --ink-soft: #aab4c3;
        --brand: #5aa7ff;
        --brand-soft: rgba(90, 167, 255, 0.18);
        --danger: #ff6961;
        --success: #57ca7b;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      }

      button, input, select { font: inherit; }

      button, .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        background: var(--surface-muted);
        cursor: pointer;
        text-decoration: none;
      }

      button:hover, .link-button:hover { border-color: var(--line-strong); }
      button:disabled { cursor: not-allowed; opacity: 0.55; }

      .button-primary {
        border-color: transparent;
        color: white;
        background: var(--brand);
        font-weight: 700;
      }

      .page {
        width: min(920px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 14px 0 52px;
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 215px;
        align-items: center;
        margin: 0 -14px 0;
        padding: 18px 48px 10px;
        overflow: hidden;
      }

      .hero::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: none;
        content: "";
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        width: min(47%, 390px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(34px, 5vw, 44px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 0 0 12px;
        color: var(--ink-soft);
        font-size: 15px;
        line-height: 1.55;
      }

      .records-button {
        min-height: 44px;
        gap: 10px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        box-shadow: 0 12px 26px rgba(0, 122, 255, 0.2);
      }

      .records-button svg { width: 21px; height: 21px; }
      .records-button .chevron { width: 17px; margin-left: 3px; }

      .hero-art {
        position: absolute;
        top: 50%;
        right: 48px;
        width: auto;
        height: min(176px, calc(100% - 24px));
        transform: translateY(-50%);
        filter: drop-shadow(0 18px 22px rgba(40, 100, 175, 0.18));
      }

      .hero-art .hero-paper-start { stop-color: #ffffff; }
      .hero-art .hero-paper-end { stop-color: #edf5ff; }
      .hero-art .hero-fold { fill: #dcecff; }
      .hero-art .hero-line { fill: #a9d3ff; }
      .hero-art .hero-sheet-back { fill: #d8e9fd; }
      .hero-art .hero-orb-ring { fill: none; stroke: var(--bg); stroke-width: 6; }

      :root[data-theme="dark"] .hero-art { filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.35)); }
      :root[data-theme="dark"] .hero-art .hero-paper-start { stop-color: #2a3546; }
      :root[data-theme="dark"] .hero-art .hero-paper-end { stop-color: #1f2a3a; }
      :root[data-theme="dark"] .hero-art .hero-fold { fill: #34445a; }
      :root[data-theme="dark"] .hero-art .hero-line { fill: #3f5e85; }
      :root[data-theme="dark"] .hero-art .hero-sheet-back { fill: #1b2534; }

      .panel {
        padding: clamp(20px, 4vw, 32px);
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field { display: grid; gap: 8px; min-width: 0; }
      .field-wide { grid-column: 1 / -1; }

      .field label, .field-label {
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .field input, .field select {
        width: 100%;
        min-width: 0;
        height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--ink);
        background: var(--surface-input);
        outline: none;
      }

      .field input:focus, .field select:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }

      .field input[readonly] {
        color: var(--ink-soft);
        cursor: default;
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      .upload {
        display: flex;
        align-items: center;
        gap: 15px;
        min-height: 98px;
        padding: 18px;
        border: 1px dashed var(--line-strong);
        border-radius: 17px;
        background: var(--surface-input);
        cursor: pointer;
        transition: border-color 0.16s ease, background 0.16s ease;
      }

      .upload:hover, .upload.is-dragover {
        border-color: var(--brand);
        background: var(--brand-soft);
      }

      .upload.is-dragover { box-shadow: 0 0 0 3px var(--brand-soft); }

      .upload-icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        border-radius: 13px;
        color: var(--brand);
        background: var(--brand-soft);
        font-size: 24px;
      }

      .upload-copy { display: grid; gap: 4px; }
      .upload-copy strong { font-size: 15px; }
      .upload-copy small { color: var(--ink-soft); line-height: 1.45; }

      .image-count { color: var(--ink-soft); font-size: 12px; font-weight: 600; }

      .image-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .image-list[hidden], .task-progress[hidden] { display: none; }
      .image-item { display: grid; gap: 8px; min-width: 0; }

      .image-preview {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
        min-height: 74px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--surface-muted);
      }

      .image-preview img {
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        border-radius: 11px;
        object-fit: cover;
      }

      .image-info { display: grid; gap: 3px; min-width: 0; flex: 1; }
      .image-name { overflow: hidden; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .image-size { color: var(--ink-soft); font-size: 12px; }

      .image-remove {
        min-width: 62px;
        min-height: 36px;
        padding: 0 11px;
        color: var(--danger);
        white-space: nowrap;
      }

      .image-note { height: 40px !important; border-radius: 11px !important; font-size: 13px; }

      .task-progress {
        display: grid;
        gap: 10px;
        margin-top: 14px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--surface-muted);
      }

      .task-progress progress { width: 100%; height: 10px; accent-color: var(--brand); }

      .task-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px 16px;
        max-height: 168px;
        overflow: auto;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .task-item { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
      .task-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .is-failed { color: var(--danger); }
      .is-succeeded { color: var(--success); }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
      }

      .status { min-height: 20px; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
      .status.error { color: var(--danger); }
      .footer-actions { display: flex; gap: 10px; margin-left: auto; }
      .footer-actions button { min-width: 112px; }

      #submissionForm.is-submitted .upload,
      #submissionForm.is-submitted .image-list,
      #submissionForm.is-submitted .image-count {
        opacity: 0.55;
        pointer-events: none;
      }

      @media (max-width: 680px) {
        @supports (-webkit-touch-callout: none) {
          .field input[type="datetime-local"] {
            padding-inline: 0;
          }

          .field input[type="datetime-local"]::-webkit-date-and-time-value {
            padding-inline-start: 14px;
            text-align: left;
          }
        }

        .page { width: min(100% - 16px, 920px); padding-top: 8px; }
        .hero { min-height: 238px; margin: -10px -8px 0; padding: 39px 23px 24px; }
        .hero-copy { width: 53%; }
        h1 { margin-bottom: 14px; font-size: clamp(29px, 8.5vw, 38px); }
        .hero p { margin-bottom: 18px; font-size: 13px; line-height: 1.75; }
        .records-button { min-height: 40px; padding: 0 13px; border-radius: 10px; font-size: 14px; }
        .records-button svg { width: 18px; height: 18px; }
        .hero-art { right: 8px; height: min(132px, calc(100% - 16px)); }
        .form-grid, .image-list, .task-list { grid-template-columns: 1fr; }
        .footer { align-items: stretch; flex-direction: column; }
        .footer-actions { width: 100%; margin: 0; }
        .footer-actions button { flex: 1; }
      }

      /* Match the business dashboard heading on desktop and mobile. */
      .hero { min-height: 0; margin-top: 0; margin-bottom: 0; padding-top: 42px; padding-bottom: 27px; }
      .hero h1 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: -1.3px; font-weight: 700; }
      .hero p { margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
      .records-button { margin-top: 14px; }
      @media (max-width: 650px) {
        .hero { padding-top: 24px; padding-bottom: 19px; }
        .hero h1 { font-size: 27px; letter-spacing: -.9px; }
        .hero p { margin-top: 8px; font-size: 11px; }
        .records-button { margin-top: 8px; }
      }

</style>

<link rel="stylesheet" href="/auth/accounts/user-menu.css">
<script src="/auth/accounts/admin-shell.js" defer></script>
<script src="/auth/accounts/user-menu.js" defer></script>
</head>
  <body>
    <nav class="topbar" aria-label="报账中心导航" data-admin-center="expense" data-admin-mode="brand"></nav>
    <main class="page">
      <header class="hero">
        <div class="hero-copy">
          <h1>新建报账</h1>
          <p>上传多张票据，系统自动识别并<br />生成独立报账记录</p>
          <a class="link-button button-primary records-button" href="/expense">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2.5" width="14" height="19" rx="2" />
              <path d="M8 8h6M8 12h6M8 16h3" />
              <circle cx="18" cy="18" r="3" fill="#087dff" />
              <path d="M18 16.5v3M16.5 18h3" />
            </svg>
            <span>查看报账记录</span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 6 6-6 6" /></svg>
          </a>
        </div>
        <svg class="hero-art" viewBox="0 0 240 200" aria-hidden="true">
          <defs>
            <linearGradient id="heroPaper" x1="0" y1="0" x2="1" y2="1"><stop class="hero-paper-start"/><stop class="hero-paper-end" offset="1"/></linearGradient>
            <linearGradient id="heroPhoto" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9d9ff"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
            <linearGradient id="heroOrb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47a4ff"/><stop offset="1" stop-color="#0067f2"/></linearGradient>
          </defs>
          <g class="hero-sheet-back" transform="rotate(-8 100 100)">
            <rect x="34" y="22" width="112" height="146" rx="14"/>
          </g>
          <g transform="rotate(5 120 100)">
            <path d="M74 14h78l34 32v120a12 12 0 0 1-12 12H74a12 12 0 0 1-12-12V26a12 12 0 0 1 12-12Z" fill="url(#heroPaper)"/>
            <path class="hero-fold" d="M152 14v24a8 8 0 0 0 8 8h26Z"/>
            <g class="hero-line">
              <rect x="78" y="36" width="44" height="8" rx="4"/>
              <rect x="78" y="58" width="84" height="8" rx="4"/>
              <rect x="78" y="76" width="92" height="8" rx="4"/>
            </g>
            <rect x="78" y="100" width="54" height="54" rx="10" fill="url(#heroPhoto)"/>
            <circle cx="118" cy="113" r="5" fill="#fff"/>
            <path d="m84 146 13-18 10 11 7-8 13 15Z" fill="#fff"/>
            <g class="hero-line">
              <rect x="142" y="104" width="30" height="8" rx="4"/>
              <rect x="142" y="120" width="22" height="8" rx="4"/>
            </g>
          </g>
          <circle cx="190" cy="150" r="38" fill="url(#heroOrb)"/>
          <circle class="hero-orb-ring" cx="190" cy="150" r="41"/>
          <path d="M190 167v-28m0 0-10 10m10-10 10 10M177 166h-3a12 12 0 0 1-1.5-24 19 19 0 0 1 36 5 10 10 0 0 1-2 19h-3" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </header>

      <section class="panel">
        <form id="submissionForm">
          <div class="form-grid">
            <div class="field">
              <label for="channelCode">门店</label>
              <select id="channelCode" name="channelCode" required>
                <option value="">正在加载门店...</option>
              </select>
            </div>
            <div class="field">
              <label for="reporter">报账人</label>
              <input id="reporter" type="text" readonly aria-readonly="true" value="正在加载..." />
            </div>
            <div class="field field-wide">
              <label for="sentAt">报账时间</label>
              <input id="sentAt" name="sentAt" type="datetime-local" step="60" required />
            </div>
            <div class="field field-wide">
              <span class="field-label">报账图（必填）</span>
              <input class="visually-hidden" id="images" name="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif" multiple />
              <label class="upload" id="imagePicker" for="images">
                <span class="upload-icon" aria-hidden="true">↑</span>
                <span class="upload-copy">
                  <strong>点击选择或拖拽多张报账图到这里</strong>
                  <small>最多 20 张；每张支持 JPG、PNG、WEBP、GIF、HEIC、HEIF，最大 20MB</small>
                </span>
              </label>
              <div class="image-list" id="imageList" hidden></div>
              <span class="image-count" id="imageCount">尚未添加报账图</span>
              <div class="task-progress" id="taskProgress" hidden>
                <strong id="taskProgressText">等待开始</strong>
                <progress id="taskProgressBar" value="0" max="1"></progress>
                <div class="task-list" id="taskList"></div>
              </div>
            </div>
          </div>
          <div class="footer">
            <span class="status" id="status" aria-live="polite"></span>
            <div class="footer-actions">
              <button id="resetButton" type="button">清空</button>
              <button class="button-primary" id="submitButton" type="submit">确认提交</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script>
      const BASE_PATH = "/expense";
      const SUBMISSION_PAGE = "submit";
      const TASK_STORAGE_KEY = "reimbursement-active-submission-task:submit";
      const IMAGE_MIME_TYPES = new Set([
        "image/jpeg", "image/png", "image/webp", "image/gif", "image/heic", "image/heif",
      ]);

      const state = {
        canSubmit: false,
        channelLocked: false,
        imageItems: [],
        imageDragDepth: 0,
        importing: false,
        submissionComplete: false,
        taskPollTimer: null,
      };

      const elements = {
        form: document.getElementById("submissionForm"),
        channelCode: document.getElementById("channelCode"),
        reporter: document.getElementById("reporter"),
        sentAt: document.getElementById("sentAt"),
        images: document.getElementById("images"),
        imagePicker: document.getElementById("imagePicker"),
        imageList: document.getElementById("imageList"),
        imageCount: document.getElementById("imageCount"),
        taskProgress: document.getElementById("taskProgress"),
        taskProgressText: document.getElementById("taskProgressText"),
        taskProgressBar: document.getElementById("taskProgressBar"),
        taskList: document.getElementById("taskList"),
        status: document.getElementById("status"),
        resetButton: document.getElementById("resetButton"),
        submitButton: document.getElementById("submitButton"),
      };

      function setStatus(message, isError = false) {
        elements.status.textContent = message;
        elements.status.classList.toggle("error", isError);
      }

      function formatLocalDateTimeInput(date = new Date()) {
        const local = new Date(date.getTime() - date.getTimezoneOffset() * 60_000);
        return local.toISOString().slice(0, 16);
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function readJsonResponse(response, fallbackMessage) {
        return response.text().then((text) => {
          try {
            return JSON.parse(text);
          } catch {
            throw new Error(response.ok ? fallbackMessage : `${fallbackMessage}（HTTP ${response.status}）`);
          }
        });
      }

      function clearTaskPollTimer() {
        if (state.taskPollTimer !== null) {
          window.clearTimeout(state.taskPollTimer);
          state.taskPollTimer = null;
        }
      }

      function clearImages() {
        for (const item of state.imageItems) {
          if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        }
        state.imageItems = [];
        state.imageDragDepth = 0;
        elements.images.value = "";
        elements.imagePicker.classList.remove("is-dragover");
        renderImages();
      }

      function setControlsDisabled(disabled) {
        for (const control of elements.form.querySelectorAll("input, select, button")) {
          control.disabled = disabled;
        }
        elements.reporter.disabled = false;
        elements.channelCode.disabled = disabled || state.channelLocked;
      }

      function renderImages() {
        elements.imageList.replaceChildren();
        elements.imageList.hidden = state.imageItems.length === 0;
        elements.imageCount.textContent = state.imageItems.length
          ? `已添加 ${state.imageItems.length} 张报账图，提交后将生成 ${state.imageItems.length} 条记录`
          : "尚未添加报账图";

        state.imageItems.forEach((item, index) => {
          const container = document.createElement("div");
          container.className = "image-item";
          const preview = document.createElement("div");
          preview.className = "image-preview";
          const image = document.createElement("img");
          image.alt = `${item.file.name} 预览`;
          if (item.previewUrl) image.src = item.previewUrl;
          else image.hidden = true;
          const info = document.createElement("div");
          info.className = "image-info";
          const name = document.createElement("span");
          name.className = "image-name";
          name.textContent = item.file.name;
          const size = document.createElement("span");
          size.className = "image-size";
          size.textContent = formatFileSize(item.file.size);
          const remove = document.createElement("button");
          remove.className = "image-remove";
          remove.type = "button";
          remove.textContent = "移除";
          remove.dataset.imageIndex = String(index);
          info.append(name, size);
          preview.append(image, info, remove);
          const note = document.createElement("input");
          note.className = "image-note";
          note.type = "text";
          note.maxLength = 300;
          note.placeholder = "这张报账图的备注（选填）";
          note.value = item.note;
          note.dataset.noteIndex = String(index);
          note.setAttribute("aria-label", `${item.file.name} 的备注`);
          container.append(preview, note);
          elements.imageList.append(container);
        });
      }

      function acceptImages(files) {
        const incoming = Array.from(files || []);
        if (!incoming.length) return false;

        const unsupported = incoming.find((file) => !IMAGE_MIME_TYPES.has(file.type));
        if (unsupported) {
          setStatus(`${unsupported.name} 不是支持的报账图格式。`, true);
          return false;
        }
        const oversized = incoming.find((file) => file.size > 20 * 1024 * 1024);
        if (oversized) {
          setStatus(`${oversized.name} 超过 20MB。`, true);
          return false;
        }

        const existingKeys = new Set(
          state.imageItems.map((item) => `${item.file.name}:${item.file.size}:${item.file.lastModified}`),
        );
        const uniqueIncoming = incoming.filter(
          (file) => !existingKeys.has(`${file.name}:${file.size}:${file.lastModified}`),
        );
        if (state.imageItems.length + uniqueIncoming.length > 20) {
          setStatus("每次最多添加 20 张报账图。", true);
          return false;
        }

        for (const file of uniqueIncoming) {
          state.imageItems.push({
            file,
            note: "",
            previewUrl: ["image/jpeg", "image/png", "image/webp", "image/gif"].includes(file.type)
              ? URL.createObjectURL(file)
              : null,
          });
        }
        setStatus("");
        renderImages();
        return true;
      }

      function taskStatusLabel(status) {
        return ({ queued: "等待中", processing: "识别中", succeeded: "成功", failed: "失败" })[status] || status;
      }

      function renderTask(task) {
        elements.taskProgress.hidden = !task;
        if (!task) {
          elements.taskProgressText.textContent = "等待开始";
          elements.taskProgressBar.max = 1;
          elements.taskProgressBar.value = 0;
          elements.taskList.replaceChildren();
          return;
        }

        elements.taskProgressText.textContent = task.status === "completed"
          ? `处理完成：成功 ${task.successCount}，失败 ${task.failedCount}`
          : `正在识别：已完成 ${task.completedCount}/${task.totalCount}`;
        elements.taskProgressBar.max = Math.max(1, task.totalCount);
        elements.taskProgressBar.value = task.completedCount;
        elements.taskList.replaceChildren();

        for (const item of task.items || []) {
          const row = document.createElement("div");
          row.className = "task-item";
          const name = document.createElement("span");
          name.className = "task-name";
          name.textContent = item.originalName;
          const status = document.createElement("span");
          status.className = `is-${item.status}`;
          status.textContent = taskStatusLabel(item.status);
          if (item.errorMessage) status.title = item.errorMessage;
          row.append(name, status);
          elements.taskList.append(row);
        }
      }

      function setUploadProgress(percent, message) {
        elements.taskProgress.hidden = false;
        elements.taskProgressText.textContent = message;
        elements.taskProgressBar.max = 100;
        elements.taskProgressBar.value = Math.max(0, Math.min(100, percent));
        elements.taskList.replaceChildren();
      }

      function enterSubmissionCompleteState() {
        state.importing = false;
        state.submissionComplete = true;
        elements.form.classList.add("is-submitted");
        setControlsDisabled(true);
        elements.submitButton.disabled = true;
        elements.resetButton.disabled = false;
        elements.resetButton.textContent = "继续报账";
        setUploadProgress(100, "提交成功");
      }

      function uploadSubmission(formData, onProgress) {
        return new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          request.open(
            "POST",
            `${BASE_PATH}/api/submissions/${encodeURIComponent(SUBMISSION_PAGE)}/batch-reports`,
          );
          request.setRequestHeader("Accept", "application/json");
          request.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
              onProgress(Math.round((event.loaded / event.total) * 100));
            }
          });
          request.addEventListener("load", () => {
            let payload;
            try {
              payload = JSON.parse(request.responseText || "{}");
            } catch {
              reject(new Error(`批量报账提交失败（HTTP ${request.status}）`));
              return;
            }
            if (request.status < 200 || request.status >= 300 || !payload.success) {
              reject(new Error(payload?.error?.message || `批量报账提交失败（HTTP ${request.status}）`));
              return;
            }
            resolve(payload);
          });
          request.addEventListener("error", () => reject(new Error("报账图上传失败，请检查网络后重试。")));
          request.addEventListener("abort", () => reject(new Error("报账图上传已取消。")));
          request.send(formData);
        });
      }

      async function pollTask(taskId) {
        clearTaskPollTimer();
        try {
          const response = await fetch(`${BASE_PATH}/api/batch-reports/${encodeURIComponent(taskId)}`, {
            headers: { Accept: "application/json" },
          });
          const payload = await readJsonResponse(response, "批量报账进度加载失败");
          if (!response.ok || !payload.success) {
            if (response.status >= 400 && response.status < 500) {
              window.localStorage.removeItem(TASK_STORAGE_KEY);
              return;
            }
            throw new Error(payload?.error?.message || "批量报账进度加载失败");
          }

          const task = payload.task;
          if (task.status === "completed") {
            window.localStorage.removeItem(TASK_STORAGE_KEY);
            return;
          }
        } catch (error) {
          // Recognition continues on the server; a transient polling error is silent.
        }

        state.taskPollTimer = window.setTimeout(() => void pollTask(taskId), 1500);
      }

      function resetForm() {
        if (state.importing) return;
        clearTaskPollTimer();
        window.localStorage.removeItem(TASK_STORAGE_KEY);
        state.submissionComplete = false;
        elements.form.classList.remove("is-submitted");
        const channelCode = elements.channelCode.value;
        const reporter = elements.reporter.value;
        elements.form.reset();
        elements.channelCode.value = channelCode;
        elements.reporter.value = reporter;
        elements.sentAt.value = formatLocalDateTimeInput();
        clearImages();
        renderTask(null);
        setControlsDisabled(false);
        elements.submitButton.disabled = !state.canSubmit;
        elements.resetButton.textContent = "清空";
        setStatus("");
      }

      async function loadOptions() {
        const response = await fetch(`${BASE_PATH}/api/submissions/${encodeURIComponent(SUBMISSION_PAGE)}/options`, {
          headers: { Accept: "application/json" },
        });
        const payload = await readJsonResponse(response, "批量报账信息加载失败");
        if (!response.ok || !payload.success) {
          throw new Error(payload?.error?.message || "批量报账信息加载失败");
        }

        state.canSubmit = payload.permissions?.canSubmit === true;
        elements.reporter.value = payload.account?.displayName || payload.account?.username || "";
        elements.channelCode.replaceChildren();
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "请选择门店";
        elements.channelCode.append(placeholder);
        for (const channel of payload.channels || []) {
          const option = document.createElement("option");
          option.value = channel.code;
          option.textContent = channel.name;
          elements.channelCode.append(option);
        }
        if ((payload.channels || []).length === 1) {
          elements.channelCode.value = payload.channels[0].code;
        }
        state.channelLocked = (payload.channels || []).length === 1;
        elements.channelCode.disabled = state.channelLocked;

        if (!state.canSubmit) {
          elements.submitButton.disabled = true;
          setStatus("当前账号没有报账提交权限。", true);
        } else if (!(payload.channels || []).length) {
          elements.submitButton.disabled = true;
          setStatus("当前页面对应的报账门店尚未启用，请联系管理员。", true);
        }
      }

      async function submitForm() {
        if (!state.canSubmit || state.importing || state.submissionComplete) return;
        if (!state.imageItems.length) {
          setStatus("请至少添加一张报账图。", true);
          return;
        }

        const formData = new FormData();
        formData.set("channelCode", elements.channelCode.value.trim());
        formData.set("sentAt", elements.sentAt.value.trim());
        formData.set("notesJson", JSON.stringify(state.imageItems.map((item) => item.note.trim())));
        for (const item of state.imageItems) {
          formData.append("images", item.file, item.file.name);
        }

        state.importing = true;
        setControlsDisabled(true);
        setUploadProgress(0, "正在上传报账图 0%");
        setStatus("");
        try {
          const payload = await uploadSubmission(formData, (percent) => {
            setUploadProgress(percent, `正在上传报账图 ${percent}%`);
          });
          window.localStorage.setItem(TASK_STORAGE_KEY, payload.task.id);
          enterSubmissionCompleteState();
          setStatus("报账图已上传，识别将在后台继续执行。", false);
          void pollTask(payload.task.id);
        } catch (error) {
          state.importing = false;
          setControlsDisabled(false);
          elements.submitButton.disabled = false;
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      elements.form.addEventListener("submit", (event) => {
        event.preventDefault();
        void submitForm();
      });
      elements.resetButton.addEventListener("click", resetForm);
      elements.images.addEventListener("change", () => {
        acceptImages(elements.images.files);
        elements.images.value = "";
      });
      elements.imagePicker.addEventListener("dragenter", (event) => {
        event.preventDefault();
        state.imageDragDepth += 1;
        elements.imagePicker.classList.add("is-dragover");
      });
      elements.imagePicker.addEventListener("dragover", (event) => {
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      });
      elements.imagePicker.addEventListener("dragleave", (event) => {
        event.preventDefault();
        state.imageDragDepth = Math.max(0, state.imageDragDepth - 1);
        if (state.imageDragDepth === 0) elements.imagePicker.classList.remove("is-dragover");
      });
      elements.imagePicker.addEventListener("drop", (event) => {
        event.preventDefault();
        state.imageDragDepth = 0;
        elements.imagePicker.classList.remove("is-dragover");
        acceptImages(event.dataTransfer?.files);
      });
      elements.imageList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-image-index]");
        if (!button || state.importing) return;
        const [removed] = state.imageItems.splice(Number(button.dataset.imageIndex), 1);
        if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
        renderImages();
        setStatus("");
      });
      elements.imageList.addEventListener("input", (event) => {
        const input = event.target.closest("[data-note-index]");
        if (!input) return;
        const item = state.imageItems[Number(input.dataset.noteIndex)];
        if (item) item.note = input.value;
      });
      async function initialize() {
        elements.sentAt.value = formatLocalDateTimeInput();
        try {
          await loadOptions();
          const taskId = window.localStorage.getItem(TASK_STORAGE_KEY);
          if (taskId) {
            enterSubmissionCompleteState();
            void pollTask(taskId);
          }
        } catch (error) {
          elements.submitButton.disabled = true;
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      void initialize();
    </script>
  </body>
</html>
