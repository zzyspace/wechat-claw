<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>报账后台</title>
    <style>
      :root {
        --bg: #f2f2f7;
        --bg-accent: #e9edf7;
        --surface: rgba(255, 255, 255, 0.84);
        --surface-strong: #ffffff;
        --line: rgba(60, 60, 67, 0.16);
        --line-strong: rgba(60, 60, 67, 0.24);
        --ink: #1c1c1e;
        --ink-soft: #6e6e73;
        --brand: #007aff;
        --brand-soft: rgba(0, 122, 255, 0.12);
        --accent: #007aff;
        --danger: #ff3b30;
        --warn: #c96f00;
        --warn-soft: rgba(255, 149, 0, 0.16);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
        --shadow: 0 24px 60px rgba(28, 28, 30, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(0, 122, 255, 0.16), transparent 28%),
          radial-gradient(circle at top right, rgba(90, 200, 250, 0.18), transparent 26%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
      }

      .page {
        width: min(1420px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .hero {
        display: grid;
        gap: 14px;
        margin-bottom: 18px;
      }

      .eyebrow {
        display: inline-flex;
        width: fit-content;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(60, 60, 67, 0.12);
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 46px);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      .hero p {
        margin: 0;
        max-width: 760px;
        color: var(--ink-soft);
        line-height: 1.7;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .controls {
        padding: 20px;
        margin-bottom: 18px;
      }

      .controls-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .field input,
      .field select,
      button {
        min-height: 46px;
        border-radius: var(--radius-md);
        border: 1px solid var(--line);
        padding: 0 14px;
        font: inherit;
      }

      .field input,
      .field select {
        width: 100%;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
      }

      .field input:focus,
      .field select:focus,
      button:focus {
        outline: 2px solid rgba(0, 122, 255, 0.28);
        outline-offset: 2px;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      button {
        cursor: pointer;
        background: var(--surface-strong);
        color: var(--ink);
        font-weight: 700;
      }

      button:hover {
        border-color: var(--line-strong);
      }

      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .button-primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #ffffff;
      }

      .button-primary:hover {
        border-color: var(--brand);
      }

      .button-danger {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 59, 48, 0.16);
        background: rgba(255, 59, 48, 0.08);
        color: var(--danger);
        font-size: 13px;
        font-weight: 700;
      }

      .button-danger:hover:not([disabled]) {
        background: rgba(255, 59, 48, 0.14);
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .summary {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 700;
      }

      .status {
        color: var(--ink-soft);
        font-size: 14px;
      }

      .status.error {
        color: var(--danger);
      }

      .content {
        display: block;
      }

      .table-panel {
        overflow: hidden;
      }

      .table-scroll {
        overflow: auto;
      }

      table {
        width: 100%;
        min-width: 1220px;
        border-collapse: collapse;
      }

      thead {
        background: rgba(255, 255, 255, 0.72);
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--ink-soft);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      td {
        font-size: 14px;
        line-height: 1.6;
      }

      .column-bill {
        width: 112px;
        min-width: 112px;
        max-width: 112px;
      }

      th:nth-child(8),
      td:nth-child(8) {
        width: 120px;
        min-width: 120px;
      }

      .column-created-at {
        width: 100px;
        min-width: 100px;
        max-width: 100px;
        white-space: normal;
      }

      .column-created-at-value {
        display: grid;
        gap: 2px;
        line-height: 1.35;
      }

      .column-created-at-date,
      .column-created-at-time {
        display: block;
        white-space: nowrap;
      }

      .column-amount-value {
        display: grid;
        gap: 2px;
        line-height: 1.35;
      }

      .column-amount-number,
      .column-amount-currency {
        display: block;
        white-space: nowrap;
      }

      th:nth-child(9),
      td:nth-child(9) {
        width: 160px;
        min-width: 160px;
      }

      th:nth-child(5),
      td:nth-child(5) {
        min-width: 120px;
      }

      th:nth-child(10),
      td:nth-child(10),
      th:nth-child(11),
      td:nth-child(11) {
        width: 120px;
        min-width: 120px;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.56);
      }

      tbody tr {
        cursor: pointer;
      }

      tbody tr.is-selected {
        background: rgba(0, 122, 255, 0.08);
      }

      .note-cell {
        max-width: 160px;
        color: var(--ink-soft);
        line-height: 1.7;
      }

      .note-content {
        word-break: break-word;
      }

      .tag.note-pill {
        margin: 0 2px;
        color: #9a6700;
        background: rgba(255, 204, 0, 0.18);
        border-color: rgba(255, 159, 10, 0.24);
      }

      .bill-link,
      .bill-placeholder {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        min-height: auto;
        padding: 0;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
      }

      .bill-link {
        cursor: zoom-in;
        padding: 4px;
      }

      .bill-link img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .bill-placeholder {
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .bill-placeholder.warn {
        color: var(--warn);
        border-color: rgba(255, 149, 0, 0.24);
        background: var(--warn-soft);
      }

      .mono {
        font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace;
        font-size: 12px;
      }

      .muted {
        color: var(--ink-soft);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(0, 122, 255, 0.1);
        border: 1px solid rgba(0, 122, 255, 0.14);
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
      }

      .tag.warn {
        color: var(--warn);
        background: var(--warn-soft);
        border-color: rgba(255, 149, 0, 0.16);
      }

      .tag.ok {
        color: var(--brand);
        background: var(--brand-soft);
        border-color: rgba(0, 122, 255, 0.16);
      }

      .tag.category-food {
        color: #1f8f46;
        background: rgba(52, 199, 89, 0.14);
        border-color: rgba(52, 199, 89, 0.18);
      }

      .tag.category-salary {
        color: #8e44ad;
        background: rgba(175, 82, 222, 0.14);
        border-color: rgba(175, 82, 222, 0.18);
      }

      .tag.category-rent {
        color: #c96f00;
        background: rgba(255, 149, 0, 0.16);
        border-color: rgba(255, 149, 0, 0.18);
      }

      .tag.category-utilities {
        color: #0077a3;
        background: rgba(90, 200, 250, 0.16);
        border-color: rgba(90, 200, 250, 0.2);
      }

      .tag.category-manager_reimbursement {
        color: #d11a52;
        background: rgba(255, 45, 85, 0.12);
        border-color: rgba(255, 45, 85, 0.16);
      }

      .tag.category-planned_expense {
        color: #4f46c7;
        background: rgba(88, 86, 214, 0.14);
        border-color: rgba(88, 86, 214, 0.18);
      }

      .tag.category-other {
        color: var(--ink-soft);
        background: rgba(120, 120, 128, 0.14);
        border-color: rgba(120, 120, 128, 0.18);
      }

      .tag.reporter-0 {
        color: #007aff;
        background: rgba(0, 122, 255, 0.12);
        border-color: rgba(0, 122, 255, 0.16);
      }

      .tag.reporter-1 {
        color: #1f8f46;
        background: rgba(52, 199, 89, 0.14);
        border-color: rgba(52, 199, 89, 0.18);
      }

      .tag.reporter-2 {
        color: #8e44ad;
        background: rgba(175, 82, 222, 0.14);
        border-color: rgba(175, 82, 222, 0.18);
      }

      .tag.reporter-3 {
        color: #c96f00;
        background: rgba(255, 149, 0, 0.16);
        border-color: rgba(255, 149, 0, 0.18);
      }

      .tag.reporter-4 {
        color: #0077a3;
        background: rgba(90, 200, 250, 0.16);
        border-color: rgba(90, 200, 250, 0.2);
      }

      .tag.reporter-5 {
        color: #d11a52;
        background: rgba(255, 45, 85, 0.12);
        border-color: rgba(255, 45, 85, 0.16);
      }

      .tag.reporter-6 {
        color: #4f46c7;
        background: rgba(88, 86, 214, 0.14);
        border-color: rgba(88, 86, 214, 0.18);
      }

      .tag.reporter-7 {
        color: #6e6e73;
        background: rgba(120, 120, 128, 0.14);
        border-color: rgba(120, 120, 128, 0.18);
      }

      .tag.reporter-8 {
        color: #0f766e;
        background: rgba(20, 184, 166, 0.14);
        border-color: rgba(20, 184, 166, 0.18);
      }

      .tag.reporter-9 {
        color: #b45309;
        background: rgba(245, 158, 11, 0.16);
        border-color: rgba(245, 158, 11, 0.2);
      }

      .tag.reporter-10 {
        color: #7c3aed;
        background: rgba(139, 92, 246, 0.14);
        border-color: rgba(139, 92, 246, 0.18);
      }

      .tag.reporter-11 {
        color: #be185d;
        background: rgba(236, 72, 153, 0.14);
        border-color: rgba(236, 72, 153, 0.18);
      }

      .tag.reporter-12 {
        color: #0369a1;
        background: rgba(14, 165, 233, 0.14);
        border-color: rgba(14, 165, 233, 0.18);
      }

      .tag.reporter-13 {
        color: #15803d;
        background: rgba(34, 197, 94, 0.14);
        border-color: rgba(34, 197, 94, 0.18);
      }

      .tag.reporter-14 {
        color: #4338ca;
        background: rgba(99, 102, 241, 0.14);
        border-color: rgba(99, 102, 241, 0.18);
      }

      .tag.reporter-15 {
        color: #c2410c;
        background: rgba(249, 115, 22, 0.14);
        border-color: rgba(249, 115, 22, 0.18);
      }

      .detail-empty {
        color: var(--ink-soft);
        line-height: 1.7;
      }

      .modal[hidden] {
        display: none;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(28, 28, 30, 0.4);
        backdrop-filter: blur(8px);
      }

      .modal-dialog {
        position: relative;
        z-index: 1;
        width: min(448px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 22px;
        border-radius: 32px;
      }

      .modal-frame {
        display: grid;
        gap: 18px;
      }

      .modal-topbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .modal-topbar h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.02em;
      }

      .modal-close {
        min-width: 46px;
        min-height: 46px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        line-height: 1;
      }

      .attachment-preview-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(60, 60, 67, 0.08);
        min-height: 220px;
      }

      .attachment-preview-stage img {
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(100vh - 220px);
        object-fit: contain;
      }

      .detail-header {
        display: grid;
        gap: 10px;
      }

      .detail-header h2 {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
      }

      .detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .detail-card {
        padding: 14px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(60, 60, 67, 0.08);
      }

      .detail-card strong {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .detail-card span {
        display: block;
        line-height: 1.7;
        word-break: break-word;
      }

      .detail-section {
        display: grid;
        gap: 12px;
        margin-top: 8px;
      }

      .detail-section h3 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .source-list,
      .receipt-list {
        display: grid;
        gap: 12px;
      }

      .source-item,
      .receipt-item {
        padding: 14px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(60, 60, 67, 0.08);
      }

      .source-head,
      .receipt-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .source-text,
      .receipt-text,
      .source-meta {
        line-height: 1.7;
        word-break: break-word;
      }

      .source-meta,
      .receipt-meta {
        color: var(--ink-soft);
        font-size: 13px;
      }

      .attachment-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .attachment-card {
        display: grid;
        gap: 8px;
      }

      .attachment-thumb {
        width: 100%;
        height: auto;
        max-height: 440px;
        object-fit: contain;
        display: block;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
      }

      .attachment-link {
        color: var(--brand);
        font-weight: 700;
        text-decoration: none;
      }

      .attachment-link:hover {
        text-decoration: underline;
      }

      .pagination {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 16px 20px 20px;
        flex-wrap: wrap;
      }

      .pagination-buttons {
        display: flex;
        gap: 10px;
      }

      .empty-state {
        padding: 30px 20px;
        color: var(--ink-soft);
        text-align: center;
      }

      @media (max-width: 900px) {
        .controls-grid,
        .detail-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .page {
          width: min(100vw - 18px, 100%);
          padding-top: 18px;
        }

        .controls-grid,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        .actions,
        .pagination {
          align-items: stretch;
        }

        .pagination-buttons {
          width: 100%;
        }

        .pagination-buttons button {
          flex: 1 1 0;
        }

        .modal {
          padding: 8px;
        }

        .modal-dialog {
          width: calc(100vw - 16px);
          max-height: calc(100vh - 16px);
          padding: 16px;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <span class="eyebrow">WECHAT CLAW / REIMBURSEMENT</span>
        <h1>报账查看后台</h1>
        <p>查看已入库的报账记录，按门店、报账人、类别、日期和备注文字筛选，并展开详情查看 OCR、原始消息、附件和回执记录。</p>
      </div>

      <div class="panel controls">
        <form id="filters">
          <div class="controls-grid">
            <div class="field">
              <label for="search">关键词 / 报账 ID</label>
              <input id="search" name="search" placeholder="支持群聊、报账人、商户、单号、OCR 或 ID" />
            </div>
            <div class="field">
              <label for="channelCode">门店</label>
              <select id="channelCode" name="channelCode">
                <option value="">全部</option>
                <option value="reimbursement_fuzzy">Fuzzy</option>
                <option value="reimbursement_peanut">Peanut</option>
                <option value="reimbursement_peanut_manager">Peanut店长报账群</option>
                <option value="reimbursement_fuzzyqz">Fuzzy泉州店</option>
              </select>
            </div>
            <div class="field">
              <label for="reporter">报账人</label>
              <input id="reporter" name="reporter" placeholder="支持部分匹配，如 Ry / 张" />
            </div>
            <div class="field">
              <label for="expenseCategory">类别</label>
              <input id="expenseCategory" name="expenseCategory" placeholder="如 food / 食材 / rent / 房租" />
            </div>
            <div class="field">
              <label for="note">备注</label>
              <input id="note" name="note" placeholder="支持部分匹配，如 补票 / 平账" />
            </div>
            <div class="field">
              <label for="createdDateFrom">创建日期从</label>
              <input id="createdDateFrom" name="createdDateFrom" type="date" />
            </div>
            <div class="field">
              <label for="createdDateTo">创建日期到</label>
              <input id="createdDateTo" name="createdDateTo" type="date" />
            </div>
            <div class="field">
              <label for="limit">每页条数</label>
              <select id="limit" name="limit">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="400">400</option>
                <option value="600">600</option>
                <option value="800">800</option>
                <option value="1000">1000</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button class="button-primary" type="submit">查询</button>
            <button id="resetFilters" type="button">重置</button>
          </div>
        </form>
        <div class="summary-row">
          <div class="summary">
            <span class="pill" id="totalPill">总数 0</span>
            <span class="pill" id="pagePill">第 1 页</span>
            <span class="pill" id="timeZonePill">时区 Asia/Shanghai</span>
          </div>
          <div class="status" id="statusText">等待加载</div>
        </div>
      </div>

      <div class="content">
        <div class="panel table-panel">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>门店</th>
                  <th class="column-created-at">创建时间</th>
                  <th>报账人</th>
                  <th>金额</th>
                  <th>类别</th>
                  <th>备注</th>
                  <th class="column-bill">附件</th>
                  <th>需复核</th>
                  <th>更新时间</th>
                  <th>报账 ID</th>
                  <th>删除</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" hidden>没有匹配的报账记录。</div>
          <div class="pagination">
            <div class="status" id="rangeText">0 - 0 / 0</div>
            <div class="pagination-buttons">
              <button id="prevPage" type="button">上一页</button>
              <button id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </div>

      </div>

      <div class="modal" id="detailModal" hidden>
        <div class="modal-backdrop" id="detailModalBackdrop"></div>
        <div class="panel modal-dialog" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
          <div class="modal-frame">
            <div class="modal-topbar">
              <h2 id="detailModalTitle">报账详情</h2>
              <button class="modal-close" id="detailModalClose" type="button" aria-label="关闭详情弹窗">×</button>
            </div>
            <div class="detail-empty" id="detailEmpty">点击左侧列表中的任意一条记录，在这里查看结构化字段、原始消息、附件和回执。</div>
            <div id="detailContent" hidden></div>
          </div>
        </div>
      </div>

      <div class="modal" id="attachmentPreviewModal" hidden>
        <div class="modal-backdrop" id="attachmentPreviewModalBackdrop"></div>
        <div class="panel modal-dialog" role="dialog" aria-modal="true" aria-labelledby="attachmentPreviewTitle">
          <div class="modal-frame">
            <div class="modal-topbar">
              <h2 id="attachmentPreviewTitle">附件预览</h2>
              <button class="modal-close" id="attachmentPreviewClose" type="button" aria-label="关闭附件预览弹窗">×</button>
            </div>
            <div class="attachment-preview-stage">
              <img id="attachmentPreviewImage" alt="附件预览" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const BASE_PATH = "/reimbursement";
      const DEFAULT_TIME_ZONE = "Asia/Shanghai";
      const state = {
        items: [],
        limit: 50,
        offset: 0,
        total: 0,
        selectedReportId: null,
        timeZone: DEFAULT_TIME_ZONE,
        deletingIds: new Set(),
      };

      const elements = {
        filters: document.getElementById("filters"),
        resetFilters: document.getElementById("resetFilters"),
        totalPill: document.getElementById("totalPill"),
        pagePill: document.getElementById("pagePill"),
        timeZonePill: document.getElementById("timeZonePill"),
        statusText: document.getElementById("statusText"),
        tableBody: document.getElementById("tableBody"),
        emptyState: document.getElementById("emptyState"),
        rangeText: document.getElementById("rangeText"),
        prevPage: document.getElementById("prevPage"),
        nextPage: document.getElementById("nextPage"),
        detailModal: document.getElementById("detailModal"),
        detailModalBackdrop: document.getElementById("detailModalBackdrop"),
        detailModalClose: document.getElementById("detailModalClose"),
        detailEmpty: document.getElementById("detailEmpty"),
        detailContent: document.getElementById("detailContent"),
        attachmentPreviewModal: document.getElementById("attachmentPreviewModal"),
        attachmentPreviewModalBackdrop: document.getElementById("attachmentPreviewModalBackdrop"),
        attachmentPreviewClose: document.getElementById("attachmentPreviewClose"),
        attachmentPreviewImage: document.getElementById("attachmentPreviewImage"),
        attachmentPreviewTitle: document.getElementById("attachmentPreviewTitle"),
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatAmount(item) {
        if (item.amount === null || item.amount === undefined) {
          return "待复核";
        }

        const amount = Number(item.amount);
        return `${amount.toFixed(2)} ${item.currency || "CNY"}`;
      }

      function sumLoadedAmounts(items) {
        return items.reduce((total, item) => {
          if (item.amount === null || item.amount === undefined) {
            return total;
          }

          const amount = Number(item.amount);
          return Number.isFinite(amount) ? total + amount : total;
        }, 0);
      }

      function parseDatabaseTimestamp(value) {
        if (!value || typeof value !== "string") {
          return null;
        }

        const normalized = value.trim().replace(" ", "T");
        const withZone = /(?:Z|[+-]\d{2}:\d{2})$/.test(normalized) ? normalized : `${normalized}Z`;
        const date = new Date(withZone);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function formatTimestamp(value) {
        const date = parseDatabaseTimestamp(value);

        if (!date) {
          return value || "-";
        }

        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: state.timeZone || DEFAULT_TIME_ZONE,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(date).replace(/\//g, "-");
      }

      function formatYesNo(value) {
        return value ? "是" : "否";
      }

      function compactText(value, fallback = "(空)") {
        const normalized = String(value ?? "").replace(/\s+/g, " ").trim();
        return normalized || fallback;
      }

      function renderRemarkContent(value, fallback = "(空)") {
        const text = compactText(value, fallback);

        if (!text.includes("平")) {
          return escapeHtml(text);
        }

        return text
          .split("平")
          .map((part) => escapeHtml(part))
          .join('<span class="tag note-pill">平</span>');
      }

      function getCategoryTagClass(categoryCode) {
        switch (String(categoryCode || "").trim()) {
          case "food":
            return "category-food";
          case "salary":
            return "category-salary";
          case "rent":
            return "category-rent";
          case "utilities":
            return "category-utilities";
          case "manager_reimbursement":
            return "category-manager_reimbursement";
          case "planned_expense":
            return "category-planned_expense";
          default:
            return "category-other";
        }
      }

      function renderCategoryTag(categoryCode, categoryLabel) {
        return `<span class="tag ${getCategoryTagClass(categoryCode)}">${escapeHtml(categoryLabel || categoryCode || "其他")}</span>`;
      }

      const REPORTER_TAG_CLASS_NAMES = Array.from({ length: 16 }, (_, index) => `reporter-${index}`);

      function hashReporterTagClass(reporter) {
        const normalized = String(reporter || "").trim();

        if (!normalized) {
          return "reporter-7";
        }

        let hash = 0;
        for (const char of normalized) {
          hash = (hash * 31 + char.codePointAt(0)) >>> 0;
        }

        return REPORTER_TAG_CLASS_NAMES[hash % REPORTER_TAG_CLASS_NAMES.length] || "reporter-7";
      }

      function buildReporterColorMap(items) {
        const normalizedReporters = [];
        const seen = new Set();

        for (const item of items) {
          const reporter = String(item.reporter || "").trim();
          if (!reporter || seen.has(reporter)) {
            continue;
          }

          seen.add(reporter);
          normalizedReporters.push(reporter);
        }

        const colorMap = new Map();

        if (normalizedReporters.length <= REPORTER_TAG_CLASS_NAMES.length) {
          normalizedReporters.forEach((reporter, index) => {
            colorMap.set(reporter, REPORTER_TAG_CLASS_NAMES[index]);
          });
          return colorMap;
        }

        normalizedReporters.forEach((reporter) => {
          colorMap.set(reporter, hashReporterTagClass(reporter));
        });

        return colorMap;
      }

      function renderReporterTag(reporter, reporterColorMap) {
        const normalized = String(reporter || "").trim();
        const colorClass =
          (normalized && reporterColorMap?.get(normalized)) || hashReporterTagClass(normalized);
        return `<span class="tag ${colorClass}">${escapeHtml(reporter || "未知")}</span>`;
      }

      const STORE_LABELS_BY_CHANNEL_CODE = new Map([
        ["reimbursement_fuzzy", "Fuzzy"],
        ["reimbursement_peanut", "Peanut"],
        ["reimbursement_peanut_manager", "Peanut店长报账群"],
        ["reimbursement_fuzzyqz", "Fuzzy泉州店"],
      ]);

      function renderStoreCell(item) {
        const label = STORE_LABELS_BY_CHANNEL_CODE.get(String(item.channelCode || "").trim());
        return escapeHtml(label || item.channelName);
      }

      function renderBillAttachment(item) {
        const attachment = item.billAttachment;

        if (!attachment) {
          return `<span class="bill-placeholder">无</span>`;
        }

        if (!attachment.exists) {
          return `<span class="bill-placeholder warn">已清理</span>`;
        }

        const href = `${BASE_PATH}/api/attachments/${attachment.id}/content`;
        return `
          <button
            type="button"
            class="bill-link"
            data-attachment-preview
            data-attachment-preview-src="${escapeHtml(href)}"
            data-attachment-preview-title="${escapeHtml(`报账 #${item.id} 附件预览`)}"
            aria-label="查看报账图片 ${item.id}"
          >
            <img src="${href}" alt="报账图片 ${item.id}" loading="lazy" />
          </button>
        `;
      }

      function renderCreatedAtCell(value) {
        const formatted = formatTimestamp(value);
        const [datePart, timePart, ...rest] = String(formatted).split(" ");

        if (!timePart) {
          return escapeHtml(formatted);
        }

        const normalizedTime = rest.length > 0 ? `${timePart} ${rest.join(" ")}` : timePart;
        return `
          <span class="column-created-at-value">
            <span class="column-created-at-date">${escapeHtml(datePart)}</span>
            <span class="column-created-at-time">${escapeHtml(normalizedTime)}</span>
          </span>
        `;
      }

      function renderAmountCell(item) {
        if (item.amount === null || item.amount === undefined) {
          return escapeHtml(formatAmount(item));
        }

        const amount = Number(item.amount);
        const currency = item.currency || "CNY";
        return `
          <span class="column-amount-value">
            <span class="column-amount-number">${escapeHtml(amount.toFixed(2))}</span>
            <span class="column-amount-currency">${escapeHtml(currency)}</span>
          </span>
        `;
      }

      function setStatus(text, isError = false) {
        elements.statusText.textContent = text;
        elements.statusText.classList.toggle("error", isError);
      }

      function buildAuthFetchUrl(pathname, params) {
        const url = new URL(`${location.origin}${pathname}`);

        if (params) {
          for (const [key, value] of params.entries()) {
            url.searchParams.set(key, value);
          }
        }

        return url.toString();
      }

      function readFilters() {
        const formData = new FormData(elements.filters);
        return {
          search: String(formData.get("search") || "").trim(),
          channelCode: String(formData.get("channelCode") || "").trim(),
          reporter: String(formData.get("reporter") || "").trim(),
          note: String(formData.get("note") || "").trim(),
          expenseCategory: String(formData.get("expenseCategory") || "").trim(),
          createdDateFrom: String(formData.get("createdDateFrom") || "").trim(),
          createdDateTo: String(formData.get("createdDateTo") || "").trim(),
          limit: String(formData.get("limit") || state.limit || 50).trim(),
        };
      }

      function writeFiltersFromUrl() {
        const params = new URLSearchParams(location.search);
        for (const name of [
          "search",
          "channelCode",
          "reporter",
          "note",
          "expenseCategory",
          "createdDateFrom",
          "createdDateTo",
          "limit",
        ]) {
          const field = elements.filters.elements.namedItem(name);
          if (!(field instanceof HTMLInputElement || field instanceof HTMLSelectElement)) {
            continue;
          }

          const value = params.get(name);
          if (value !== null) {
            field.value = value;
          }
        }

        const offsetValue = params.get("offset");
        state.offset = offsetValue ? Math.max(Number.parseInt(offsetValue, 10) || 0, 0) : 0;
      }

      function updateUrl() {
        const params = new URLSearchParams();
        const filters = readFilters();

        for (const [key, value] of Object.entries(filters)) {
          if (value && value !== "all" && !(key === "limit" && value === "50")) {
            params.set(key, value);
          }
        }

        if (state.offset > 0) {
          params.set("offset", String(state.offset));
        }

        const query = params.toString();
        history.replaceState(null, "", query ? `${BASE_PATH}?${query}` : BASE_PATH);
      }

      function buildListParams() {
        const filters = readFilters();
        const params = new URLSearchParams();

        if (filters.search) params.set("search", filters.search);
        if (filters.channelCode) params.set("channelCode", filters.channelCode);
        if (filters.reporter) params.set("reporter", filters.reporter);
        if (filters.note) params.set("note", filters.note);
        if (filters.expenseCategory) params.set("expenseCategory", filters.expenseCategory);
        if (filters.createdDateFrom) params.set("createdDateFrom", filters.createdDateFrom);
        if (filters.createdDateTo) params.set("createdDateTo", filters.createdDateTo);
        params.set("limit", filters.limit || "50");
        params.set("offset", String(state.offset));

        return params;
      }

      function renderTable() {
        elements.tableBody.innerHTML = "";
        elements.emptyState.hidden = state.items.length !== 0;

        if (state.items.length === 0) {
          return;
        }

        const fragment = document.createDocumentFragment();
        const reporterColorMap = buildReporterColorMap(state.items);

        for (const item of state.items) {
          const row = document.createElement("tr");
          row.setAttribute("data-report-id", String(item.id));
          row.classList.toggle("is-selected", item.id === state.selectedReportId);
          const isDeleting = state.deletingIds.has(item.id);
          row.innerHTML = `
            <td>${renderStoreCell(item)}</td>
            <td class="column-created-at">${renderCreatedAtCell(item.createdAt)}</td>
            <td>${renderReporterTag(item.reporter, reporterColorMap)}</td>
            <td>${renderAmountCell(item)}</td>
            <td>${renderCategoryTag(item.expenseCategory, item.expenseCategoryLabel)}</td>
            <td class="note-cell"><span class="note-content">${renderRemarkContent(item.note, "-")}</span></td>
            <td class="column-bill">${renderBillAttachment(item)}</td>
            <td><span class="tag ${item.needsReview ? "warn" : "ok"}">${item.needsReview ? "需复核" : "已确认"}</span></td>
            <td>${escapeHtml(formatTimestamp(item.updatedAt))}</td>
            <td><button type="button" data-report-id="${item.id}">#${item.id}</button></td>
            <td><button class="button-danger" type="button" data-delete-id="${item.id}" ${isDeleting ? "disabled" : ""}>${isDeleting ? "删除中" : "删除"}</button></td>
          `;
          fragment.appendChild(row);
        }

        elements.tableBody.appendChild(fragment);
      }

      function renderSummary() {
        const pageIndex = Math.floor(state.offset / state.limit) + 1;
        const rangeStart = state.total === 0 ? 0 : state.offset + 1;
        const rangeEnd = state.offset + state.items.length;

        elements.totalPill.textContent = `总数 ${state.total}`;
        elements.pagePill.textContent = `第 ${pageIndex} 页`;
        elements.timeZonePill.textContent = `时区 ${state.timeZone}`;
        elements.rangeText.textContent = `${rangeStart} - ${rangeEnd} / ${state.total}`;
        elements.prevPage.disabled = state.offset <= 0;
        elements.nextPage.disabled = state.offset + state.items.length >= state.total;
      }

      function closeDetailModal() {
        elements.detailModal.hidden = true;
      }

      function openDetailModal() {
        elements.detailModal.hidden = false;
      }

      function closeAttachmentPreviewModal() {
        elements.attachmentPreviewModal.hidden = true;
        elements.attachmentPreviewImage.removeAttribute("src");
        elements.attachmentPreviewImage.alt = "附件预览";
        elements.attachmentPreviewTitle.textContent = "附件预览";
      }

      function openAttachmentPreviewModal(src, title) {
        if (!src) {
          return;
        }

        elements.attachmentPreviewImage.src = src;
        elements.attachmentPreviewImage.alt = title || "附件预览";
        elements.attachmentPreviewTitle.textContent = title || "附件预览";
        elements.attachmentPreviewModal.hidden = false;
      }

      function renderDetail(report) {
        elements.detailEmpty.hidden = true;
        elements.detailContent.hidden = false;
        openDetailModal();

        const sourceItems = report.sources
          .map((source) => {
            const attachments = source.attachments.length
              ? `<div class="attachment-grid">${source.attachments
                  .map((attachment) => {
                    if (!attachment.exists) {
                      return `
                        <div class="attachment-card">
                          <span class="tag warn">附件已清理</span>
                          <div class="source-meta mono">attachment #${attachment.id}</div>
                        </div>
                      `;
                    }

                    const href = `${BASE_PATH}/api/attachments/${attachment.id}/content`;
                    if (attachment.mimeType && attachment.mimeType.startsWith("image/")) {
                      return `
                        <div class="attachment-card">
                          <a class="attachment-link" href="${href}" target="_blank" rel="noreferrer">
                            <img class="attachment-thumb" src="${href}" alt="attachment-${attachment.id}" />
                          </a>
                          <a class="attachment-link mono" href="${href}" target="_blank" rel="noreferrer">attachment #${attachment.id}</a>
                        </div>
                      `;
                    }

                    return `
                      <div class="attachment-card">
                        <span class="tag">附件</span>
                        <a class="attachment-link mono" href="${href}" target="_blank" rel="noreferrer">attachment #${attachment.id}</a>
                      </div>
                    `;
                  })
                  .join("")}</div>`
              : `<div class="source-meta">无附件</div>`;

            return `
              <div class="source-item">
                <div class="source-head">
                  <span class="tag">${escapeHtml(source.role)}</span>
                  <span class="source-meta mono">raw_message_id=${source.rawMessageId}</span>
                </div>
                <div class="source-meta">${escapeHtml(source.senderName)} · ${escapeHtml(formatTimestamp(source.eventReceivedAt))}</div>
                <div class="source-meta mono">external_id=${escapeHtml(source.messageExternalId)}</div>
                <div class="source-text">${escapeHtml(compactText(source.textContent))}</div>
                ${attachments}
              </div>
            `;
          })
          .join("");

        const receiptItems = report.receiptDeliveries.length
          ? report.receiptDeliveries
              .map(
                (receipt) => `
                  <div class="receipt-item">
                    <div class="receipt-head">
                      <span class="tag">${escapeHtml(receipt.targetType)}</span>
                      <span class="receipt-meta">${escapeHtml(formatTimestamp(receipt.sentAt))}</span>
                    </div>
                    <div class="receipt-meta">${escapeHtml(receipt.targetValue)}</div>
                    <div class="receipt-text">${escapeHtml(compactText(receipt.receiptText))}</div>
                    <div class="receipt-meta mono">delivery_id=${receipt.id}${receipt.rawMessageId ? ` · raw_message_id=${receipt.rawMessageId}` : ""}</div>
                  </div>
                `,
              )
              .join("")
          : `<div class="detail-empty">没有回执记录。</div>`;

        elements.detailContent.innerHTML = `
          <div class="detail-header">
            <h2>报账 #${report.id}</h2>
            <div class="detail-meta">
              <span class="tag">${escapeHtml(report.channelName)}</span>
              <span class="tag ${report.needsReview ? "warn" : "ok"}">${report.needsReview ? "需复核" : "已确认"}</span>
              ${renderCategoryTag(report.expenseCategory, report.expenseCategoryLabel)}
            </div>
          </div>

          <div class="detail-section">
            <h3>来源消息</h3>
            <div class="source-list">${sourceItems || `<div class="detail-empty">没有来源消息。</div>`}</div>
          </div>

          <div class="detail-section">
            <h3>结构化字段</h3>
            <div class="detail-grid">
              <div class="detail-card"><strong>群聊</strong><span>${escapeHtml(report.channelName)}${report.channelCode ? ` (${escapeHtml(report.channelCode)})` : ""}</span></div>
              <div class="detail-card"><strong>报账人</strong><span>${escapeHtml(report.reporter)}</span></div>
              <div class="detail-card"><strong>金额</strong><span>${escapeHtml(formatAmount(report))}</span></div>
              <div class="detail-card"><strong>票据日期</strong><span>${escapeHtml(report.voucherDate)} (${escapeHtml(report.voucherDateSource)})</span></div>
              <div class="detail-card"><strong>类别</strong><span>${escapeHtml(report.expenseCategoryLabel || report.expenseCategory)}</span></div>
              <div class="detail-card"><strong>证据类型</strong><span>${escapeHtml(report.evidenceType)}</span></div>
              <div class="detail-card"><strong>商户</strong><span>${escapeHtml(report.merchant || "(空)")}</span></div>
              <div class="detail-card"><strong>单号</strong><span>${escapeHtml(report.documentNo || "(空)")}</span></div>
              <div class="detail-card"><strong>凭证类型</strong><span>${escapeHtml(report.voucherType || "(空)")}</span></div>
              <div class="detail-card"><strong>置信度</strong><span>${Number(report.confidence).toFixed(2)}</span></div>
              <div class="detail-card"><strong>创建时间</strong><span>${escapeHtml(formatTimestamp(report.createdAt))}</span></div>
              <div class="detail-card"><strong>更新时间</strong><span>${escapeHtml(formatTimestamp(report.updatedAt))}</span></div>
              <div class="detail-card" style="grid-column: 1 / -1;"><strong>备注</strong><span class="note-content">${renderRemarkContent(report.note)}</span></div>
              <div class="detail-card" style="grid-column: 1 / -1;"><strong>OCR</strong><span>${escapeHtml(compactText(report.ocrText || "(空)"))}</span></div>
            </div>
          </div>

          <div class="detail-section">
            <h3>回执记录</h3>
            <div class="receipt-list">${receiptItems}</div>
          </div>
        `;
      }

      async function loadDetail(reportId) {
        state.selectedReportId = reportId;
        renderTable();
        openDetailModal();
        elements.detailEmpty.hidden = false;
        elements.detailContent.hidden = true;
        elements.detailContent.innerHTML = "";
        elements.detailEmpty.textContent = `正在加载报账 #${reportId} 详情...`;
        setStatus(`正在加载报账 #${reportId} 详情...`);

        try {
          const response = await fetch(buildAuthFetchUrl(`${BASE_PATH}/api/reports/${reportId}`), {
            headers: {
              Accept: "application/json",
            },
          });
          const payload = await response.json();

          if (!response.ok || !payload.success) {
            throw new Error(payload?.error?.message || "详情加载失败");
          }

          state.timeZone = payload.timeZone || state.timeZone || DEFAULT_TIME_ZONE;
          elements.timeZonePill.textContent = `时区 ${state.timeZone}`;
          elements.detailEmpty.textContent = "点击左侧列表中的任意一条记录，在这里查看结构化字段、原始消息、附件和回执。";
          renderDetail(payload.report);
          setStatus(`已加载报账 #${reportId} 详情`);
        } catch (error) {
          elements.detailEmpty.hidden = false;
          elements.detailContent.hidden = true;
          elements.detailContent.innerHTML = "";
          elements.detailEmpty.textContent = error instanceof Error ? error.message : String(error);
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      async function loadReports({ resetOffset = false } = {}) {
        if (resetOffset) {
          state.offset = 0;
        }

        state.limit = Number.parseInt(readFilters().limit || "50", 10) || 50;
        updateUrl();
        setStatus("正在加载报账列表...");

        try {
          const response = await fetch(buildAuthFetchUrl(`${BASE_PATH}/api/reports`, buildListParams()), {
            headers: {
              Accept: "application/json",
            },
          });
          const payload = await response.json();

          if (!response.ok || !payload.success) {
            throw new Error(payload?.error?.message || "列表加载失败");
          }

          state.items = payload.items || [];
          state.total = payload.total || 0;
          state.limit = payload.limit || state.limit;
          state.offset = payload.offset || 0;
          state.timeZone = payload.timeZone || state.timeZone || DEFAULT_TIME_ZONE;

          renderTable();
          renderSummary();
          setStatus(`已加载 ${state.items.length} 条记录，总计金额 ${sumLoadedAmounts(state.items).toFixed(2)} 元`);

          if (state.selectedReportId && state.items.some((item) => item.id === state.selectedReportId)) {
            renderTable();
          } else if (state.selectedReportId) {
            state.selectedReportId = null;
            closeDetailModal();
          }
        } catch (error) {
          state.items = [];
          state.total = 0;
          renderTable();
          renderSummary();
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      async function deleteReport(reportId) {
        if (!window.confirm(`确认删除报账 #${reportId} 吗？此操作不可恢复。`)) {
          return;
        }

        state.deletingIds.add(reportId);
        renderTable();
        setStatus(`正在删除报账 #${reportId}...`);

        try {
          const response = await fetch(buildAuthFetchUrl(`${BASE_PATH}/api/reports/${reportId}`), {
            method: "DELETE",
            headers: {
              Accept: "application/json",
            },
          });
          const payload = await response.json();

          if (!response.ok || !payload.success) {
            throw new Error(payload?.error?.message || "删除失败");
          }

          if (state.selectedReportId === reportId) {
            state.selectedReportId = null;
            closeDetailModal();
            elements.detailEmpty.hidden = false;
            elements.detailContent.hidden = true;
            elements.detailContent.innerHTML = "";
            elements.detailEmpty.textContent = "点击左侧列表中的任意一条记录，在这里查看结构化字段、原始消息、附件和回执。";
          }

          setStatus(`已删除报账 #${reportId}`);
          await loadReports();
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
        } finally {
          state.deletingIds.delete(reportId);
          renderTable();
        }
      }

      elements.filters.addEventListener("submit", (event) => {
        event.preventDefault();
        void loadReports({ resetOffset: true });
      });

      elements.resetFilters.addEventListener("click", () => {
        elements.filters.reset();
        state.offset = 0;
        state.selectedReportId = null;
        closeAttachmentPreviewModal();
        closeDetailModal();
        elements.detailEmpty.hidden = false;
        elements.detailContent.hidden = true;
        elements.detailContent.innerHTML = "";
        elements.detailEmpty.textContent = "点击左侧列表中的任意一条记录，在这里查看结构化字段、原始消息、附件和回执。";
        void loadReports({ resetOffset: true });
      });

      elements.prevPage.addEventListener("click", () => {
        state.offset = Math.max(0, state.offset - state.limit);
        void loadReports();
      });

      elements.nextPage.addEventListener("click", () => {
        if (state.offset + state.items.length >= state.total) {
          return;
        }

        state.offset += state.limit;
        void loadReports();
      });

      elements.tableBody.addEventListener("click", (event) => {
        const target = event.target;

        if (!(target instanceof HTMLElement)) {
          return;
        }

        const previewButton = target.closest("[data-attachment-preview]");
        if (previewButton instanceof HTMLElement) {
          openAttachmentPreviewModal(
            previewButton.getAttribute("data-attachment-preview-src") || "",
            previewButton.getAttribute("data-attachment-preview-title") || "附件预览",
          );
          return;
        }

        const deleteButton = target.closest("button[data-delete-id]");
        if (deleteButton) {
          const reportId = Number.parseInt(deleteButton.getAttribute("data-delete-id") || "", 10);
          if (!Number.isFinite(reportId) || reportId <= 0 || state.deletingIds.has(reportId)) {
            return;
          }

          void deleteReport(reportId);
          return;
        }

        const trigger = target.closest("[data-report-id]");
        if (!trigger) {
          return;
        }

        const reportId = Number.parseInt(trigger.getAttribute("data-report-id") || "", 10);
        if (!Number.isFinite(reportId) || reportId <= 0) {
          return;
        }

        void loadDetail(reportId);
      });

      elements.detailModalBackdrop.addEventListener("click", () => {
        closeDetailModal();
      });

      elements.detailModalClose.addEventListener("click", () => {
        closeDetailModal();
      });

      elements.attachmentPreviewModalBackdrop.addEventListener("click", () => {
        closeAttachmentPreviewModal();
      });

      elements.attachmentPreviewClose.addEventListener("click", () => {
        closeAttachmentPreviewModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !elements.attachmentPreviewModal.hidden) {
          closeAttachmentPreviewModal();
          return;
        }

        if (event.key === "Escape" && !elements.detailModal.hidden) {
          closeDetailModal();
        }
      });

      writeFiltersFromUrl();
      void loadReports();
    </script>
  </body>
</html>
